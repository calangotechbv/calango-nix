# foot configuration
#
# Full reference: man 5 foot.ini
# Validate without launching:  foot --check-config
#
# A deliberate mirror of kitty/kitty.conf, so the two terminals look and feel
# the same. Where foot has no equivalent the kitty setting is called out rather
# than silently dropped -- see "What kitty does that foot cannot" at the bottom.
#
# Note that foot cannot reload its configuration at runtime: there is no
# load_config_file equivalent and SIGUSR1 switches colour theme rather than
# re-reading this file. Every change here needs a new window.


# ===========================================================================
# Themes
# ===========================================================================

# Includes are a [main] key, so they have to sit above the first section
# header -- which also fixes their precedence: everything below overrides
# them, and the last include wins over the first.
#
# Paths must be absolute or start with "~/". The footThemes placeholder below
# (see the literal include= line) is a token home/foot.nix's footConfig
# derivation substitutes at build time with the absolute store path of the
# copied foot/themes directory, so this resolves correctly regardless of
# where ~/.config/foot ends up.

# Swap this line to change themes. foot ships 84 more in /usr/share/foot/themes
# (tokyonight-night, gruvbox, nord, ...), includable by absolute path.
include=@footThemes@/monokai-pro.ini

# Colours written by the quickshell theme switcher (theme-switcher/Theme.qml),
# after the theme above on purpose so a switched theme wins over whichever
# themes/*.ini is selected.
#
# Unlike kitty's globinclude, a missing include is a hard error in foot -- it
# refuses to start at all. home/foot.nix's footThemeColors activation hook
# therefore creates this file empty if it is absent, and an empty file is a
# valid foot config.
include=@footState@/theme-colors.ini


# ===========================================================================
# Fonts
# ===========================================================================

# fontconfig format: a family name followed by colon-separated options. Extra
# comma-separated families are fallbacks, searched in order for glyphs the
# primary font lacks -- which is how you would replace kitty's symbol_map if
# you ever switch to a font without the Nerd Font ranges baked in.
font=AdwaitaMono Nerd Font Mono:size=12

# foot renders box- and line-drawing characters itself instead of using font
# glyphs (box-drawings-uses-font-glyphs=no, the default). That is what keeps
# tmux borders and TUI frames gap-less, and it is strictly better than what
# the Nerd Font provides -- so it is left alone.


# ===========================================================================
# Terminal
# ===========================================================================

# Terminal type advertised to programs. foot's terminfo is not installed on
# most remote hosts; either copy it over (see foot's man page for the
# "foot-extra" entry) or set term=xterm-256color if you ssh a lot.
term=foot

# What gets a double-click selection to stop. Whitespace always counts.
word-delimiters=,│`|:"'()[]{}<>

# Selecting with the mouse copies to the primary selection (middle-click
# paste). Ctrl+Shift+c still reaches the real clipboard. Matches kitty's
# copy_on_select=no.
selection-target=primary


# ===========================================================================
# Window
# ===========================================================================

pad=8x8

initial-window-size-chars=120x34

# Decorations are left to the compositor (csd.preferred defaults to server),
# which under Hyprland means none -- same result as kitty's
# hide_window_decorations=no on this desktop.


# ===========================================================================
# Scrollback
# ===========================================================================

[scrollback]
lines=20000

# Lines to scroll per mouse wheel notch.
multiplier=3.0


# ===========================================================================
# Cursor
# ===========================================================================

[cursor]
style=block
blink=yes
blink-rate=500

# kitty's cursor_shape_unfocused.
unfocused-style=hollow


# ===========================================================================
# Mouse & URLs
# ===========================================================================

[mouse]
hide-when-typing=yes

[url]
# kitty's open_url_with=default.
launch=xdg-open ${url}
# No `style=curly`. It is a newer key -- foot 1.21, which Debian 13 ships, has
# no `style` in [url] at all and rejects the whole config over it, the same way
# it rejects [colors-dark]. URLs are underlined either way; only the shape of
# the underline is lost, and only on the older foot. Put it back in a
# hosts/<hostname>.ini if a machine has a foot new enough to want it.


# ===========================================================================
# Bell
# ===========================================================================

[bell]
# No audio bell; flash the window and ask the compositor for attention.
system=no
visual=yes
urgent=yes


# ===========================================================================
# Colors
# ===========================================================================

# [colors], not [colors-dark]. The dark/light split is a newer foot feature:
# Debian 13 ships foot 1.21.0, whose parser rejects the section outright with
# "invalid section name: colors-dark" and refuses the whole config, so every
# foot on that machine came up unconfigured. [colors] is the base section and
# is understood by every version, including the ones that do have the split --
# so this is the spelling that works on both distros.
#
# Nothing was lost by dropping it. The theme switcher writes one palette at a
# time into theme-colors.ini and never wrote a light section at all, so the
# dark/light distinction was never doing any work here.
[colors-dark]
# Transparency. Hyprland blurs whatever shows through (decoration:blur in
# hyprland.lua), so foot's own `blur` -- which needs ext-background-effect-v1
# and is off by default -- stays off, exactly as kitty's background_blur does.
#
# Only alpha is set here: the palette comes from the includes at the top of
# the file, and duplicate keys are resolved per key, so this does not clobber
# them.
alpha=0.75


# ===========================================================================
# Keyboard
# ===========================================================================

# Ctrl+Shift is foot's prefix too, so these already match kitty with no help:
#
#   Ctrl+Shift+c / Ctrl+Shift+v   copy / paste
#   Ctrl+plus / minus / 0         font size up / down / reset
#   Ctrl+Shift+u                  unicode input
#
# Shift+Insert is the exception, and it is rebound below.
#
# Ctrl+Shift+r starts a scrollback search, which kitty has no equivalent for.
# It is kept, and it is the reason kitty's Ctrl+Shift+r resize-mode binding is
# not reproduced -- foot has no splits to resize anyway.
[key-bindings]

# --- Clipboard ------------------------------------------------------------
# Shift+Insert pastes the clipboard rather than the primary selection. foot
# ships it the other way (primary-paste=Shift+Insert), as does kitty, and that
# was the one input the terminals answered differently from every other window
# on this desktop. See the long note in kitty.conf: GTK4, Qt, Chromium and
# Firefox all paste the clipboard on this key, GTK4 has no key theme left to
# change that with, so the terminals are the side that moves.
#
# The primary selection keeps middle-click, which is primary-paste under
# [mouse-bindings] -- a separate entry, bound to BTN_MIDDLE, left alone. Tested
# on suffer with PRIMARYMARK in the primary selection: middle-click in kitty
# pasted it, and so did middle-click in a GTK4 entry.
#
# Ctrl+Shift+s is kitty's own default for paste_from_selection, transposed here
# for parity. Be warned that it pastes NOTHING on this desktop today, and
# neither does kitty's. Tested three ways -- foot's Ctrl+Shift+s, kitty's
# Ctrl+Shift+s, and a throwaway kitty binding of F9 to paste_from_selection --
# all three produced not one byte, while `wl-paste -p` read PRIMARYMARK back
# fine at the moment of the keypress, and while middle-click in the same window
# worked. So the selection is there and the terminals cannot reach it from the
# keyboard. Hyprland implements middle-click paste itself -- the option is
# misc:middle_click_paste, default true -- which is the likely reason that one
# path still works.
#
# The line is kept rather than set to `none` because it is what kitty ships, it
# costs nothing, and it starts working again by itself if the cause is ever
# found. Nothing was lost by this file: the route was already dead.
primary-paste=Control+Shift+s
clipboard-paste=Control+Shift+v XF86Paste Shift+Insert

# --- Windows -------------------------------------------------------------
# foot has no splits or tabs by design; a new window is the closest thing, so
# it takes kitty's split binding. Starts in the current directory if the shell
# emits OSC 7. Moved off foot's Ctrl+Shift+n default to free that for
# prompt-next below.
spawn-terminal=Control+Shift+Return

# kitty's close_window.
quit=Control+Shift+w

# --- Scrolling -----------------------------------------------------------
scrollback-up-line=Control+Shift+Up
scrollback-down-line=Control+Shift+Down
scrollback-up-page=Control+Shift+Page_Up Shift+Page_Up
scrollback-down-page=Control+Shift+Page_Down Shift+Page_Down
scrollback-home=Control+Shift+Home
scrollback-end=Control+Shift+End

# Jump between shell prompts (needs shell integration, same OSC 133 markers
# kitty uses). Remapped from foot's Ctrl+Shift+z / Ctrl+Shift+x to kitty's p/n.
prompt-prev=Control+Shift+p
prompt-next=Control+Shift+n

# --- Scrollback in a pager ------------------------------------------------
# kitty's show_scrollback / show_last_command_output. foot pipes to an external
# command rather than hosting the pager itself, so these spool to a temp file
# and open it in a second foot window. The two commands must differ from each
# other, which is what the differing --title gives us as a side benefit.
pipe-scrollback=[sh -c "f=$(mktemp) && cat >$f && foot --title=scrollback less --chop-long-lines --RAW-CONTROL-CHARS +G $f; rm -f $f"] Control+Shift+g
pipe-command-output=[sh -c "f=$(mktemp) && cat >$f && foot --title=output less --chop-long-lines --RAW-CONTROL-CHARS +G $f; rm -f $f"] Control+Shift+o

# --- URL mode -------------------------------------------------------------
# Labels every visible URL; type a label to act on it. This is foot's whole
# answer to kitty's hints kittens. Moved off Ctrl+Shift+o so the pager above
# can have it, which is where kitty puts show_last_command_output.
show-urls-launch=Control+Shift+e
show-urls-copy=Control+Shift+f

unicode-input=Control+Shift+u


# ===========================================================================
# What kitty does that foot cannot
# ===========================================================================
#
# Left out because foot has no equivalent, not because they were forgotten:
#
#   ligatures                 foot dropped ligature support; :fontfeatures=
#                             on the font line is as close as it gets
#   modify_font cell_height   line-height takes points or px, not a percentage
#   cursor_trail              no cursor animation
#   tabs, splits, layouts     deliberate; that is Hyprland's or tmux's job
#   set_background_opacity    alpha is fixed at startup
#   load_config_file          no runtime config reload at all
#   kitten @ / listen_on      no remote control, hence no live recolouring --
#                             the theme switcher writes theme-colors.ini and
#                             the next window picks it up
#   clear_terminal            use the shell's own reset


# ===========================================================================
# Scrollback search
# ===========================================================================

# The search prompt (Ctrl+Shift+r) is a binding table of its own, with its own
# copy of both paste entries, defaulting the same way [key-bindings] does.
# Without these two lines Shift+Insert would mean the clipboard in the terminal
# and the primary selection in the search prompt of that same terminal.
#
# The clipboard-paste value is foot's default with Shift+Insert appended; the
# extra Ctrl+v and Ctrl+y are foot's, and they are safe here because the search
# prompt is foot's own widget rather than a program reading a tty. Ctrl+Shift+s
# matches the terminal binding above, with the same caveat: it is inert today.
[search-bindings]
primary-paste=Control+Shift+s
clipboard-paste=Control+v Control+y Control+Shift+v XF86Paste Shift+Insert


# ===========================================================================
# Per-host overrides
# ===========================================================================

# Back to [main] so `include` is a valid key again. Last include wins, so
# anything reached from here overrides everything above -- including alpha.
#
# The footHostInclude placeholder below (the bare line under [main]) is a
# token home/foot.nix's footConfig derivation resolves at build time: either
# an `include=` line pointing at the absolute store path of
# hosts/<hostname>.ini, or a comment saying no such file exists on this
# machine. foot is the only config here that needs that resolution done ahead
# of time -- its `include` takes an absolute path and nothing else, with no
# globbing, no environment expansion and no way to run a program, so it
# cannot pick a file by hostname the way hyprland.lua and kitty.conf do at
# runtime.
#
# foot treats a missing include as a fatal error, so home/foot.nix's build
# always substitutes something valid here rather than leaving a dangling
# reference -- the comment form when there is no host file to include.
[main]
@footHostInclude@
