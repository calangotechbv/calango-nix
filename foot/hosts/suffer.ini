# suffer: the laptop.
#
# Reached from foot.ini through the generated host.ini, last of all, so anything
# set here wins over the shared config. Empty until this machine needs something
# the desktop should not have.
#
# Examples:
#   font=AdwaitaMono Nerd Font Mono:size=11
#   [colors]
#   alpha=0.92
#
# Remember that `include` is a [main] key: if you open a section here, add an
# explicit [main] header before writing another include.
