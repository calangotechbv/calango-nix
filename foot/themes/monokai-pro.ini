# -*- conf -*-
# Monokai Pro (default filter)
#
# The same palette as kitty/themes/monokai-pro.conf, transposed to foot's key
# names, so the two terminals are pixel-identical on this theme. See that file
# for where the values come from and why terminal.background is base3 rather
# than the editor's base2.
#
# Deliberately NOT /usr/share/foot/themes/monokai-pro: the bundled one uses
# base2 (#2D2A2E) as the background and defines no selection, url or cursor
# colours, so it would not match kitty.
#
# foot colours are RRGGBB with no "#" prefix.
#
# [colors] rather than [colors-dark]: foot 1.21, which is what Debian 13 ships,
# rejects the dark/light sections and with them the entire config. See foot.ini.

[colors-dark]
#: terminal.background / terminal.foreground
background=403e41
foreground=fcfcfa

selection-foreground=fcfcfa
selection-background=5b595c

urls=78dce8

# -- Normal ---------------------------------------------------------------
#: WARNING: regular0 is also the background, so ANSI black is invisible. That
#: is genuinely how upstream's VS Code theme behaves; use 221f22 (base1) to
#: keep it legible at the cost of exactness.
regular0=403e41
regular1=ff6188
regular2=a9dc76
regular3=ffd866
#: Monokai Pro has no blue. Upstream maps ansiBlue to orange, which is what
#: this does; swap in 78dce8 to borrow the cyan instead.
regular4=fc9867
regular5=ab9df2
regular6=78dce8
regular7=fcfcfa

# -- Bright ---------------------------------------------------------------
#: Upstream sets every bright accent identical to its normal counterpart;
#: only bright black differs.
bright0=727072
bright1=ff6188
bright2=a9dc76
bright3=ffd866
bright4=fc9867
bright5=ab9df2
bright6=78dce8
bright7=fcfcfa

# No cursor colour. The two spellings are mutually exclusive: `[cursor] color`
# is gone in foot 1.27 (Fedora 44) and `cursor=` under [colors] does not exist
# in 1.21 (Debian 13), so either one rejects the whole config on the other
# machine. foot's default is the foreground and background reversed, which
# tracks whatever palette is loaded -- the one behaviour that needs no key at
# all. kitty still gets an explicit accent-coloured cursor.
