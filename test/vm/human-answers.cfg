# What a PERSON answers at the installer's prompts. Test scaffolding, not part
# of the product.
#
# The generated preseed is served byte-identical to the one .#calangoBootstrap
# ships (sha256 60024326e513fd13223c27a5b3ffa458c819935ab20e53d70b5c4df158ff10ab)
# and is fetched by the boot line's own url=. Every line below stands in for a
# prompt RUNBOOK.md's Stage 0 tells the reader to answer themselves, and every
# one is a question the generated preseed REFUSES to drive. That refusal is the
# spec's central claim, so this file existing at all is the claim holding.
#
# This file rides in the INITRD, not on the kernel command line. The command
# line was tried first and panicked the kernel:
#
#   Kernel panic - not syncing: Too many boot env vars at
#   `apt-setup/cdrom/set-first=false'
#
# The kernel passes unrecognised key=value cmdline args to init as environment
# variables and caps how many it will take, so 30 answers plus the boot line
# is past the limit. d-i loads /preseed.cfg from the initrd root before it asks
# anything, then fetches url= and applies that too -- the two files answer
# disjoint questions, which is the property under test.
#
# One choice is deliberate rather than convenient: root gets a real password.
# With an empty root password the installer puts the first user in `sudo` by
# itself, and Gate A's new sudo check would pass without the preseed's
# late_command doing anything. A real root password is the case where
# late_command is the only thing that can add that group.

# locale and keyboard
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string calango-vm   # CALANGO_VM_HOST
d-i netcfg/get_domain string
d-i netcfg/hostname string calango-vm       # CALANGO_VM_HOST

# mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# clock
d-i time/zone string UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false

# the disk -- the whole of what the generated preseed will not touch
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/default_filesystem string ext4
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# passwords -- the username itself comes from the GENERATED preseed
d-i passwd/root-login boolean true
d-i passwd/root-password password rehearsal          # CALANGO_VM_PW
d-i passwd/root-password-again password rehearsal    # CALANGO_VM_PW
d-i passwd/user-fullname string Rehearsal
d-i passwd/user-password password rehearsal          # CALANGO_VM_PW
d-i passwd/user-password-again password rehearsal    # CALANGO_VM_PW

# bootloader and apt media
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda
d-i apt-setup/cdrom/set-first boolean false
d-i finish-install/reboot_in_progress note
