# matugen config that renders ONLY the quickshell wallpaper theme.
# Used via `matugen image <img> -c this-file`, so it never touches your own
# matugen setup.
#
# The two paths below are placeholder tokens, not real paths: the Home
# Manager module's substituteInPlace rewrites them at build time -- the first
# into an absolute store path, the second into the real state directory. Do
# not hand-resolve them here: matugen cannot expand $dir the way set.sh does,
# so input_path has to already be an absolute path by the time matugen reads
# it.
[config]

[templates.quickshell]
input_path = '@quickshellStore@/theme-switcher/wallpaper-theme/matugen/template.json'
output_path = '@quickshellState@/theme-switcher/wallpaper-theme.json'
