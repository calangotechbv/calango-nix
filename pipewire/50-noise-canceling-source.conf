# A noise-canceling capture source, from RNNoise and a LADSPA noise gate.
#
# Two problems, two filters, and only one of them is a denoiser:
#
#   rnnoise   removes steady noise -- a fan, the street, a keyboard.
#   gate      closes the microphone while nobody near it speaks, which is
#             what keeps a colleague's conversation off the far end.
#
# RNNoise cannot do the second job on its own -- it is trained to KEEP speech
# and discard everything else, so another person's voice passes straight
# through it. Neither filter removes a colleague who talks while you talk;
# nothing in open-source PipeWire does.
#
# THE GATE IS NOT PIPEWIRE'S BUILTIN `noisegate`, AND MUST NOT BE CHANGED BACK
# TO IT. That builtin cannot open. Its `Level` port loads as an INPUT control
# with the range 0.0 to 0.0, and the node declares no output controls at all
# (`n_notify:0`), so the level it compares against its threshold is permanently
# zero and any threshold above zero shuts it for ever. Measured on 2026-08-20
# against a microphone at rms 9200 of 32768: output was digital silence at a
# threshold of 0.04, still digital silence at 0.001, and passed audio ONLY at
# exactly 0.0, which is no gating at all. The shipped configuration made this
# machine's microphone permanently silent and a person found it by listening.
#
# swh-plugins' gate_1410 was proven to gate in both directions on the same
# microphone the same day: -60 dB passed audio, +10 dB blocked everything.
#
# Note the units differ from the builtin. The threshold is in DECIBELS and the
# times are in MILLISECONDS. The input port is named `Input`, not `In`.
#
# The plugin names below are deliberately NOT paths. PipeWire appends ".so" and
# looks the result up in a directory list; an absolute path is refused:
#
#   [E] plugin_ladspa.c: failed to load plugin '/nix/store/...librnnoise_ladspa'
#       in '/usr/lib64/ladspa:/usr/lib/ladspa:/nix/store/...-pipewire-1.6.6/lib'
#
# home/audio.nix therefore sets LADSPA_PATH in a filter-chain.service drop-in,
# and that path now holds TWO directories: rnnoise's and swh-plugins'.
# That drop-in also carries X-Restart-Triggers naming this file's store path,
# without which sd-switch leaves the service running the previous graph.
# Measured 2026-08-20: sd-switch DOES diff drop-ins, so that mechanism works.
#
# No `flags = [ nofail ]`, unlike PipeWire's own example. With nofail a broken
# graph yields a running service that filters nothing. Without it the unit
# fails visibly and stops after five attempts.
#
# Threshold (dB) ships at -70, which is upstream's default AND the minimum the
# port accepts, so the gate is as open as it can be. That is deliberate: an
# untuned gate must not be able to silence a microphone, which is the exact
# failure this file already caused once. Tune it upward from a MEASURED speech
# level; see the results document.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Noise Canceling source"
            media.name       = "Noise Canceling source"
            filter.graph = {
                nodes = [
                    {
                        type    = ladspa
                        name    = rn
                        plugin  = "librnnoise_ladspa"
                        label   = noise_suppressor_mono
                        control = { "VAD Threshold (%)" = 50.0 }
                    }
                    {
                        type    = ladspa
                        name    = gate
                        plugin  = "gate_1410"
                        label   = gate
                        control = {
                            "Threshold (dB)" = -70.0
                            "Attack (ms)"    = 5.0
                            "Hold (ms)"      = 200.0
                            "Decay (ms)"     = 50.0
                            "Range (dB)"     = -90.0
                        }
                    }
                ]
                links = [ { output = "rn:Output" input = "gate:Input" } ]
            }
            audio.position = [ MONO ]
            capture.props  = { node.name = "effect_input.rnnoise" node.passive = true }
            playback.props = { node.name = "effect_output.rnnoise" media.class = Audio/Source }
        }
    }
]
