# Stop Chrome from turning the microphone gain back up.
#
# WebRTC's analog automatic gain control does not just scale the samples it
# receives: when it decides the input is too quiet it reaches back through the
# PulseAudio API and raises the *capture device's* volume, so a mic lowered by
# hand climbs back to 100% a few seconds into the next call. On this machine
# that shows up on the fifine, whose ALSA "Mic" control has 31dB of range for
# Chrome to walk up.
#
# `block-source-volume` is PipeWire's own answer to this -- the shipped
# pipewire-pulse.conf carries the same rule, commented out, for Discord. It
# drops source volume writes coming from the matched client and nothing else:
# Chrome still captures, still runs its digital gain, still sets its own stream
# volume, and wpctl/the shell panel still move the device.
#
# Matched on the binary rather than the client name because Chrome's capture
# client announces itself as "Google Chrome input" while its playback client is
# "Google Chrome", and only the process binary covers both without a regex.
#
# Slack and Signal run the same WebRTC stack and can do the same thing. They
# are not listed because they have not been seen doing it here; add them as
# further `{ application.process.binary = "..." }` lines in the same matches
# array if they start.
pulse.rules = [
    {
        matches = [ { application.process.binary = "chrome" } ]
        actions = { quirks = [ block-source-volume ] }
    }
]
