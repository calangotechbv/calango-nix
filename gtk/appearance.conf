# The desktop's GTK appearance, pinned.
#
# Sourced by home/gtk.nix's gtkAppearance activation hook, which `.`-sources
# this file inside a `sh -c` and passes each value as the matching
# apply-gtk-theme flag. That script's normal mode treats gsettings as the source
# of truth and only propagates it into the ini files GTK actually reads; this
# file is the other direction -- the values this repo *wants*, pushed into
# gsettings on a machine that has never had them.
#
# Which is the whole point of checking it in. Every value below happens to be a
# stock Fedora 44 default today, so on another current Fedora a bare
# `apply-gtk-theme` already lands here. Pinning them is what makes a different
# distro -- or a future Fedora that changes its mind -- match anyway. GNOME
# switched the default interface font from Cantarell to Adwaita Sans in 48;
# without this file, an older or non-GNOME system silently renders in whatever
# it prefers and the desktop looks subtly wrong rather than obviously broken.
#
# Debian 13 is that different distro, and it is not close: a fresh trixie
# resolves gtk-theme to Breeze, icon-theme to breeze-dark and font-name to
# Inter, none of which this file names. So pushing these values on activation
# is not optional there the way it nearly is on Fedora -- it is the step that
# makes the two machines look the same. It needs the fonts to exist first,
# which home/default.nix's home.packages provides.
#
# Shell syntax: this is `.`-sourced, so quote anything with a space.

# GTK theme. Adwaita is compiled into GTK as a gresource and has no directory
# under /usr/share/themes, which is why apply-gtk-theme validates it against a
# built-in list rather than by path.
theme="Adwaita"

icons="Adwaita"

# Also set as XCURSOR_THEME/XCURSOR_SIZE in hypr/hyprland.lua, because that has
# to be in the environment before a client starts and so cannot come from here.
# The duplication is real; apply-gtk-theme warns if the two drift apart.
cursor="Adwaita"
cursor_size="24"

# Adwaita Sans is GNOME's fork of Inter, Adwaita Mono a fork of Iosevka. On
# Fedora they are `adwaita-sans-fonts` and `adwaita-mono-fonts`; on Debian they
# are not packaged at all, in which case fontconfig falls back silently and
# nothing tells you -- a fresh trixie substitutes Noto Sans for both.
# home/default.nix's home.packages installs both (pkgs.adwaita-fonts, plus
# pkgs.nerd-fonts.adwaita-mono for the Nerd Font the shell and terminals use)
# and fonts.fontconfig.enable = true links them into ~/.local/share/fonts, so
# by the time this file is sourced the fonts already exist regardless of
# distro.
#
# Keep these two names in step with the packages in home/default.nix.
#
# Note this is the *interface* font. The terminals and the shell's own widgets
# use AdwaitaMono Nerd Font, named separately in the QML and in kitty.conf.
font="Adwaita Sans 11"
mono_font="Adwaita Mono 11"

# Per-host overrides, last so they win. hosts/<hostname>.conf is sourced if this
# machine has one -- the same arrangement hyprland.lua, kitty.conf and foot.ini
# use, and for the same reason: this file is shared to every machine by
# Syncthing, so a value that is right for one is wrong for the others.
#
# cursor_size is the value most likely to want it: a laptop panel at scale 1.5
# and a desktop monitor at 1.67 do not want the same pointer.
#
# Resolved at build time by home/gtk.nix -- an absolute store path, or
# /dev/null on a machine with no hosts/<hostname>.conf.
# shellcheck source=/dev/null
. "@gtkHostConf@"

# Deliberately no `scheme` here. Dark/light is owned by the quickshell theme
# switcher, which writes org.gnome.desktop.interface color-scheme on every theme
# change (theme-switcher/Theme.qml, applySystemColorScheme). Pinning it in this
# file would mean every home-manager switch silently reverting whatever theme
# you last picked.
#
# Also deliberately absent: font-hinting and font-antialiasing. apply-gtk-theme
# reads those from gsettings and derives the Xft keys from them, but exposes no
# flag to set them -- and `slight`/`grayscale` are the default essentially
# everywhere. Add a flag to the script if that ever stops being true.
